server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: transitops-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/transitops?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:VHJhbnNpdE9wcy1EZXZlbG9wbWVudC1TZWNyZXQtS2V5LU11c3QtQmUtQ2hhbmdlZA==}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    issuer: transitops-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size-bytes: ${UPLOAD_MAX_BYTES:10485760}
  bootstrap-admin:
    name: ${APP_ADMIN_NAME:TransitOps Admin}
    email: ${APP_ADMIN_EMAIL:admin@transitops.com}
    password: ${APP_ADMIN_PASSWORD:Admin@123}
  license-reminder:
    enabled: ${LICENSE_REMINDER_ENABLED:false}
    days-ahead: ${LICENSE_REMINDER_DAYS:30}
    recipient: ${LICENSE_REMINDER_RECIPIENT:}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
