spring.application.name=backend

server.port=8080

# ===============================
# MYSQL DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/transitops_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# REACT FRONTEND CORS
# ===============================

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# ===============================
# INITIAL SYSTEM ADMINISTRATOR
# ===============================

app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:System Administrator}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@transitops.com}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}

# =====================================
# JWT CONFIGURATION
# =====================================

app.jwt.issuer=transitops-backend
app.jwt.audience=transitops-frontend

# Access token validity
app.jwt.access-token-minutes=15

# Refresh token validity
app.jwt.refresh-token-days=7

# Local development secret.
# Replace using JWT_SECRET environment variable before deployment.
app.jwt.secret=${JWT_SECRET:GxGX0iN+eqwfWNHSLN2f5jEl8gZIdBeFEi3MiA+MM+Y=}
# =====================================
# LOGIN SECURITY
# =====================================

app.security.max-failed-login-attempts=5
app.security.account-lock-minutes=15